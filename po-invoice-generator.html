<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO Invoice Generator — United Textile Mills</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:36px;width:100%;max-width:480px}
h1{font-size:1.4rem;font-weight:700;color:#1a202c;margin-bottom:6px}
.subtitle{font-size:.85rem;color:#718096;margin-bottom:28px}
label{display:block;font-size:.82rem;font-weight:600;color:#4a5568;margin-bottom:5px;margin-top:16px}
input,select{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.9rem;outline:none;transition:border .2s}
input:focus{border-color:#4299e1}
.drop{border:2px dashed #cbd5e0;border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:4px}
.drop:hover,.drop.over{border-color:#4299e1;background:#ebf8ff}
.drop svg{margin-bottom:8px;color:#a0aec0}
.drop p{font-size:.85rem;color:#718096}
.drop .fname{font-size:.8rem;color:#4299e1;font-weight:600;margin-top:4px}
#pdfFile{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
btn{display:block;width:100%;margin-top:24px;padding:12px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button{display:block;width:100%;margin-top:24px;padding:12px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#2c5282}
button:disabled{background:#a0aec0;cursor:not-allowed}
#status{margin-top:16px;padding:10px 14px;border-radius:8px;font-size:.85rem;display:none}
.ok{background:#f0fff4;color:#276749;border:1px solid #c6f6d5}
.err{background:#fff5f5;color:#c53030;border:1px solid #fed7d7}
.info{background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
</style>
</head>
<body>
<div class="card">
  <h1>PO Invoice Generator</h1>
  <p class="subtitle">United Textile Mills Pvt. Ltd.</p>

  <label>Purchase Order PDF</label>
  <div class="drop" id="dropzone" onclick="document.getElementById('pdfFile').click()">
    <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
    </svg>
    <p>Click or drag a PDF here</p>
    <p class="fname" id="fname"></p>
  </div>
  <input type="file" id="pdfFile" accept=".pdf">

  <label>Invoice Number</label>
  <input type="text" id="invNo" placeholder="e.g. INV-001" required>

  <div class="row">
    <div>
      <label>Invoice Date</label>
      <input type="date" id="invDate">
    </div>
    <div>
      <label>Cartons Capacity (pcs)</label>
      <input type="number" id="capacity" value="100" min="1">
    </div>
  </div>

  <button id="btn" onclick="run()">Generate Excel</button>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

// ── Constants ─────────────────────────────────────────────────────────────
const SIZE_ORDER = {XS:0,S:1,M:2,L:3,XL:4,XXL:5,'2XL':5,'3XL':6};
const VALID_SIZES = new Set(['XS','S','M','L','XL','XXL','2XL','3XL']);
const TMPL_INV_ROWS = 5;   // rows 23-27
const TMPL_PKG_ROWS = 37;  // rows 17-53

// ── Helpers ───────────────────────────────────────────────────────────────
function sortItems(items){
  return [...items].sort((a,b)=>(SIZE_ORDER[a.size]??99)-(SIZE_ORDER[b.size]??99));
}

function numToWordsIndian(n){
  n=Math.round(n);
  if(n===0)return'ZERO';
  const ones=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE',
    'TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN',
    'SEVENTEEN','EIGHTEEN','NINETEEN'];
  const tens=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function twoDig(x){return x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');}
  function threeDig(x){
    if(x>=100)return ones[Math.floor(x/100)]+' HUNDRED'+(x%100?' '+twoDig(x%100):'');
    return twoDig(x);
  }
  const parts=[];
  if(n>=10000000){parts.push(threeDig(Math.floor(n/10000000))+' CRORE');n%=10000000;}
  if(n>=100000){parts.push(threeDig(Math.floor(n/100000))+' LAKH');n%=100000;}
  if(n>=1000){parts.push(twoDig(Math.floor(n/1000))+' THOUSAND');n%=1000;}
  if(n>0)parts.push(threeDig(n));
  return parts.join(' ')+' ONLY';
}

function calcCartons(items,cap){
  const cartons=[];let no=1;
  for(const item of sortItems(items)){
    const full=Math.floor(item.qty/cap), rem=item.qty%cap;
    const as=`${item.barcode} - ${item.size}`;
    for(let i=0;i<full;i++)cartons.push({no:no++,article_size:as,description:item.description,color:item.color,qty:cap});
    if(rem)cartons.push({no:no++,article_size:as,description:item.description,color:item.color,qty:rem});
  }
  return cartons;
}

// ── PDF text extraction ───────────────────────────────────────────────────
async function extractPDFText(buf){
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const byY=new Map();
    for(const item of content.items){
      const y=Math.round(item.transform[5]);
      if(!byY.has(y))byY.set(y,[]);
      byY.get(y).push(item);
    }
    const ys=[...byY.keys()].sort((a,b)=>b-a);
    for(const y of ys){
      const row=byY.get(y).sort((a,b)=>a.transform[4]-b.transform[4]);
      lines.push(row.map(i=>i.str).join(''));
    }
  }
  return lines.join('\n');
}

// ── PO Parser ─────────────────────────────────────────────────────────────
function extractColorSizeDesc(prefix,line2){
  const t1=prefix.trim().split(/\s+/);
  const t2=line2.trim().split(/\s+/);
  const all=[...t1,...t2];
  let si=all.findIndex(t=>VALID_SIZES.has(t.toUpperCase()));
  if(si<0)return[prefix.trim(),line2.trim(),''];
  const color=all.slice(0,si).join(' ');
  const size=all[si].toUpperCase();
  const n1=t1.length;
  let desc;
  if(si<n1){
    const after=t1.slice(si+1);
    if(after.length&&after[after.length-1].endsWith('-')){
      const pre=after.join(' ');
      desc=t2.length?pre.trimEnd()+t2[0]+(t2.length>1?' '+t2.slice(1).join(' '):''):pre;
    } else if(after.length){
      desc=after.join(' ')+(t2.length?' '+t2.join(' '):'');
    } else {
      desc=t2.join(' ');
    }
  } else {
    desc=all.slice(si+1).join(' ');
  }
  return[color.trim(),size,desc.trim()];
}

function parsePO(text){
  const result={};
  let m;
  m=text.match(/Order No\.\s*:\s*([A-Z0-9()/\-]+)/);
  result.po_number=m?m[1].trim():'';
  m=text.match(/Date\s*:\s*(\d{2}-\d{2}-\d{4})/);
  result.po_date=m?m[1].replace(/-/g,'.'):'';
  m=text.match(/GSTIN\s*[:\-]+\s*([A-Z0-9]{15})/);
  result.consignee_gst=m?m[1]:'36AAQCS3643G1Z2';
  m=text.match(/(Nexon Omniverse Limited)/);
  result.consignee_name=m?m[1].trim():'Nexon Omniverse Limited';
  m=text.match(/IGST\s*\[?\s*@\s*(\d+)%/);
  result.igst_rate=m?parseFloat(m[1])/100:0.05;

  // Address
  const am=text.match(/AWL INDIA PVT LTD[^\n]*\n([^\n]*)\n([^\n]*(?:Malkajgiri|Medchal)[^\n]*)\n([^\n]*500078)/);
  result.consignee_address_lines=am?[
    text.match(/AWL INDIA PVT LTD[^\n]*/)[0].trim(),
    (am[1].trim()+' '+am[2].trim()).trim(),
    am[3].trim(),
    'Telangana,INDIA'
  ]:[
    'AWL INDIA PVT LTD, SV NO 705/2, 706/4 DEVARYAMJAL, Opp.',
    'Sai Geetha Ashramam, Tumkunta Municipality, Medchal Malkajgiri',
    'Hyderabad, 500078',
    'Telangana,INDIA'
  ];

  // Items
  const itemRe=/(\d{13})\s+STYLE\s+UNION\s+(\w+)\s+(.+?)\s+(\d{7,8})\s+(\d+\.\d{3})\s*(\d+\.\d{2})\s+([\d,]+\.\d{3})\s+PCS\s+([\d,]+\.\d{2})\n(.+)/gm;
  const items=[];
  let im;
  while((im=itemRe.exec(text))!==null){
    const [,barcode,style,prefix,hsn,rate,mrp,qty,amount,line2]=im;
    const [color,size,desc]=extractColorSizeDesc(prefix,line2);
    items.push({
      barcode:barcode.trim(),style:style.trim(),color,hsn:hsn.trim(),
      rate:parseFloat(rate),mrp:parseFloat(mrp),
      qty:parseInt(parseFloat(qty.replace(/,/g,''))),
      amount:parseFloat(amount.replace(/,/g,'')),
      size,description:desc
    });
  }
  result.items=items;
  return result;
}

// ── SheetJS helpers ───────────────────────────────────────────────────────
function addr(r,c){return XLSX.utils.encode_cell({r:r-1,c:c-1});}

function wSet(ws,row,col,val){
  const a=addr(row,col);
  const t=typeof val==='number'?'n':'s';
  if(!ws[a])ws[a]={t,v:val};
  else{ws[a].t=t;ws[a].v=val;}
  if(t==='n')ws[a].w=String(val);
}

function saveRowStyle(ws,row,ncols){
  const s=[];
  for(let c=1;c<=ncols;c++){
    const a=addr(row,c);
    s.push(ws[a]&&ws[a].s?JSON.parse(JSON.stringify(ws[a].s)):null);
  }
  return s;
}

function applyRowStyle(ws,row,styles){
  for(let c=1;c<=styles.length;c++){
    const a=addr(row,c);
    if(!ws[a])ws[a]={t:'z',v:''};
    if(styles[c-1])ws[a].s=JSON.parse(JSON.stringify(styles[c-1]));
  }
}

function clearColBorders(ws,col){
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let r=0;r<=range.e.r;r++){
    const a=XLSX.utils.encode_cell({r,c:col-1});
    if(ws[a]&&ws[a].s){
      ws[a].s={...ws[a].s,border:{}};
    }
  }
}

function deleteInsertRows(ws,firstRow,delCount,insCount){
  const range=XLSX.utils.decode_range(ws['!ref']);
  const maxRow=range.e.r; // 0-indexed

  // Save and delete template rows, then shift everything below
  const shift=insCount-delCount;
  if(shift!==0){
    // Move cells from firstRow+delCount onwards
    const moved={};
    for(let r=firstRow-1+delCount;r<=maxRow;r++){
      for(let c=0;c<=range.e.c;c++){
        const src=XLSX.utils.encode_cell({r,c});
        if(ws[src]){
          moved[XLSX.utils.encode_cell({r:r+shift,c})]=ws[src];
          delete ws[src];
        }
      }
    }
    // Clear template rows
    for(let r=firstRow-1;r<firstRow-1+delCount;r++){
      for(let c=0;c<=range.e.c;c++){
        delete ws[XLSX.utils.encode_cell({r,c})];
      }
    }
    Object.assign(ws,moved);
    range.e.r=maxRow+shift;
    ws['!ref']=XLSX.utils.encode_range(range);
  }

  // Update merges
  if(ws['!merges']){
    ws['!merges']=ws['!merges'].map(m=>{
      if(m.s.r>=firstRow-1+delCount){
        return{s:{r:m.s.r+shift,c:m.s.c},e:{r:m.e.r+shift,c:m.e.c}};
      }
      if(m.s.r>=firstRow-1)return null; // deleted
      return m;
    }).filter(Boolean);
  }

  // Update row heights
  if(ws['!rows']){
    const rows=ws['!rows'];
    const newRows=[...rows.slice(0,firstRow-1)];
    for(let i=0;i<insCount;i++)newRows.push(null);
    newRows.push(...rows.slice(firstRow-1+delCount));
    ws['!rows']=newRows;
  }
}

// ── Fill INV ──────────────────────────────────────────────────────────────
function fillINV(ws,po,invNo,invDate,totalCartons){
  const items=sortItems(po.items);
  const n=items.length;
  const totalQty=items.reduce((s,i)=>s+i.qty,0);
  const totalAmt=items.reduce((s,i)=>s+i.amount,0);
  const igst=po.igst_rate||0.05;
  const igstAmt=Math.round(totalAmt*igst);
  const grand=totalAmt+igstAmt;
  const consignee=po.consignee_name||'Nexon Omniverse Limited';
  const adr=po.consignee_address_lines||[];
  const gst=po.consignee_gst||'36AAQCS3643G1Z2';

  // Header
  wSet(ws,2,7,`Invoice No : ${invNo}`);
  wSet(ws,3,7,`Date of Issue of Invoice :  ${invDate}`);
  wSet(ws,9,7,`Purchase Order No : ${po.po_number}`);
  wSet(ws,10,8,po.po_date||'');
  wSet(ws,12,7,`  No. of Cartons : ${totalCartons}`);

  // Address (rows 15-20)
  wSet(ws,15,1,consignee+'\n');
  wSet(ws,15,7,consignee+'\n');
  // fix vertical alignment for Nexon row
  ['A15','G15'].forEach(a=>{if(ws[a]&&ws[a].s)ws[a].s={...ws[a].s,alignment:{horizontal:'left',vertical:'top',wrapText:true}};});
  adr.slice(0,4).forEach((line,i)=>{wSet(ws,16+i,1,line);wSet(ws,16+i,7,line);});
  wSet(ws,20,1,`GST NO :- ${gst}`);
  wSet(ws,20,7,`GST NO :- ${gst}`);

  // Clear col O borders
  clearColBorders(ws,15);

  // Save style from first template item row
  const FIRST=23;
  const itemStyle=saveRowStyle(ws,FIRST,14);

  deleteInsertRows(ws,FIRST,TMPL_INV_ROWS,n);

  // Set row heights
  if(!ws['!rows'])ws['!rows']=[];
  while(ws['!rows'].length<FIRST-1+n)ws['!rows'].push(null);

  for(let idx=0;idx<n;idx++){
    const row=FIRST+idx;
    const item=items[idx];
    applyRowStyle(ws,row,itemStyle);
    ws['!rows'][row-1]={hpt:21.75};
    // merge B:C
    if(!ws['!merges'])ws['!merges']=[];
    ws['!merges'].push({s:{r:row-1,c:1},e:{r:row-1,c:2}});
    wSet(ws,row,1,idx+1);
    wSet(ws,row,2,item.barcode);
    wSet(ws,row,4,item.color);
    wSet(ws,row,5,item.size);
    wSet(ws,row,6,item.description);
    wSet(ws,row,7,item.style);
    wSet(ws,row,8,parseInt(item.hsn)||item.hsn);
    wSet(ws,row,9,'EA');
    wSet(ws,row,10,item.mrp);
    wSet(ws,row,11,item.rate);
    wSet(ws,row,12,item.qty);
    wSet(ws,row,13,item.qty);
    wSet(ws,row,14,item.amount);
  }

  const T=FIRST+n;
  wSet(ws,T,12,totalQty);wSet(ws,T,13,totalQty);wSet(ws,T,14,totalAmt);
  wSet(ws,T+1,14,0);wSet(ws,T+2,14,totalAmt);
  wSet(ws,T+3,14,0);wSet(ws,T+4,14,0);
  wSet(ws,T+6,12,igst);wSet(ws,T+6,14,igstAmt);
  wSet(ws,T+9,14,0);wSet(ws,T+10,14,grand);
  wSet(ws,T+11,1,`Amount Chargeable ( in Words ) : ${numToWordsIndian(grand)}.`);
  wSet(ws,T+12,1,`IGST Amount ( in words) : ${numToWordsIndian(igstAmt)}.`);
}

// ── Fill PKG ──────────────────────────────────────────────────────────────
function fillPKG(ws,po,invNo,invDate,cartons,totalCartons){
  const totalPcs=cartons.reduce((s,c)=>s+c.qty,0);
  const consignee=po.consignee_name||'Nexon Omniverse Limited';
  const adr=po.consignee_address_lines||[];
  const gst=po.consignee_gst||'36AAQCS3643G1Z2';

  wSet(ws,3,5,`Tax invoice No: ${invNo}`);
  wSet(ws,4,5,`Date of issue of Invoice :${invDate}`);
  wSet(ws,5,5,`P.O.NO.: ${po.po_number}`);
  wSet(ws,7,5,`Total No of Cartons:- ${totalCartons}`);
  wSet(ws,8,5,`Total No of pcs. ${totalPcs}`);

  wSet(ws,10,1,consignee);
  adr.slice(0,4).forEach((line,i)=>wSet(ws,11+i,1,line));
  wSet(ws,15,1,`GSTIN :${gst}`);

  const FIRST=17;
  const cartonStyle=saveRowStyle(ws,FIRST,10);

  deleteInsertRows(ws,FIRST,TMPL_PKG_ROWS,cartons.length);

  if(!ws['!rows'])ws['!rows']=[];
  while(ws['!rows'].length<FIRST-1+cartons.length)ws['!rows'].push(null);

  for(let i=0;i<cartons.length;i++){
    const row=FIRST+i;
    const c=cartons[i];
    applyRowStyle(ws,row,cartonStyle);
    ws['!rows'][row-1]={hpt:29.25};
    wSet(ws,row,1,'');
    wSet(ws,row,2,c.no);
    wSet(ws,row,3,'OF');
    wSet(ws,row,4,totalCartons);
    wSet(ws,row,5,c.article_size);
    wSet(ws,row,6,c.description);
    wSet(ws,row,7,c.color);
    wSet(ws,row,8,c.qty);
    wSet(ws,row,9,1);
    wSet(ws,row,10,c.qty);
  }
  const TOT=FIRST+cartons.length;
  wSet(ws,TOT,8,totalPcs);wSet(ws,TOT,10,totalPcs);
}

// ── Main generate ─────────────────────────────────────────────────────────
function generateExcel(po,invNo,capacity,invDate){
  const wb=XLSX.read(TEMPLATE_B64,{type:'base64',cellStyles:true});
  const wsInv=wb.Sheets['INV'];
  const wsPkg=wb.Sheets['PKG'];
  const cartons=calcCartons(po.items,capacity);
  fillINV(wsInv,po,invNo,invDate,cartons.length);
  fillPKG(wsPkg,po,invNo,invDate,cartons,cartons.length);
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true});
  return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ── UI ────────────────────────────────────────────────────────────────────
function setStatus(msg,cls){
  const el=document.getElementById('status');
  el.textContent=msg; el.className=cls; el.style.display='block';
}

async function run(){
  const fileInput=document.getElementById('pdfFile');
  const file=window._droppedFile||fileInput.files[0];
  if(!file){setStatus('Please select a PDF file.','err');return;}
  const invNo=document.getElementById('invNo').value.trim();
  if(!invNo){setStatus('Please enter an invoice number.','err');return;}
  const rawDate=document.getElementById('invDate').value;
  const invDate=rawDate?rawDate.split('-').reverse().join('.'):'';
  const capacity=parseInt(document.getElementById('capacity').value)||100;

  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Processing…';
  setStatus('Reading PDF…','info');

  try{
    const buf=await file.arrayBuffer();
    setStatus('Extracting text…','info');
    const text=await extractPDFText(buf);
    setStatus('Parsing PO…','info');
    const po=parsePO(text);
    if(!po.items||po.items.length===0){
      throw new Error('No items found in PDF. Please make sure it is a Style Union PO.');
    }
    setStatus(`Parsed ${po.items.length} items. Generating Excel…`,'info');
    const blob=generateExcel(po,invNo,capacity,invDate);
    const fname=`${invNo}-${po.po_number||'invoice'}.xlsx`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fname;a.click();
    URL.revokeObjectURL(url);
    setStatus(`✓ Downloaded ${fname}`,'ok');
  }catch(e){
    setStatus('Error: '+e.message,'err');
    console.error(e);
  }
  btn.disabled=false;btn.textContent='Generate Excel';
}
</script>
