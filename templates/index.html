<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PO → Invoice Generator | United Textile Mills</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      color: #1a202c;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      width: 100%;
      max-width: 560px;
      padding: 40px;
    }

    .logo { font-size: 22px; font-weight: 700; color: #2b6cb0; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #718096; margin-bottom: 32px; }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: #2d3748; }

    /* ── drop zone ── */
    #drop-zone {
      border: 2px dashed #bee3f8;
      border-radius: 12px;
      background: #ebf8ff;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      margin-bottom: 24px;
      position: relative;
    }
    #drop-zone.drag-over { background: #bee3f8; border-color: #3182ce; }
    #drop-zone.has-file  { background: #f0fff4; border-color: #38a169; }
    #file-input { display: none; }

    .drop-icon { font-size: 36px; margin-bottom: 10px; display: block; }
    .drop-text { font-size: 14px; color: #4a5568; }
    .drop-text strong { color: #3182ce; cursor: pointer; }
    #file-name {
      margin-top: 10px;
      font-size: 13px;
      color: #276749;
      font-weight: 600;
      display: none;
    }

    /* ── form fields ── */
    .fields { display: grid; gap: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }
    label span { font-weight: 400; color: #a0aec0; margin-left: 4px; }

    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      color: #2d3748;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #3182ce; }

    /* ── submit button ── */
    button[type="submit"] {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: #3182ce;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s, transform .1s;
      position: relative;
    }
    button[type="submit"]:hover  { background: #2b6cb0; }
    button[type="submit"]:active { transform: scale(.98); }
    button[type="submit"]:disabled { background: #a0aec0; cursor: not-allowed; }

    /* ── spinner ── */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      position: absolute;
      right: 18px; top: 50%;
      transform: translateY(-50%);
    }
    button.loading .spinner { display: block; }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── messages ── */
    .message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.error   { background: #fff5f5; border: 1px solid #fed7d7; color: #c53030; }
    .message.success { background: #f0fff4; border: 1px solid #c6f6d5; color: #276749; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">United Textile Mills</div>
  <div class="subtitle">Purchase Order → Invoice &amp; Packing List Generator</div>

  <h1>Upload Purchase Order</h1>

  <form id="po-form">
    <!-- Drop zone -->
    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
      <span class="drop-icon">📄</span>
      <div class="drop-text">Drag &amp; drop your PO PDF here, or <strong>browse</strong></div>
      <div id="file-name"></div>
    </div>
    <input type="file" id="file-input" accept=".pdf" />

    <div class="fields">
      <div>
        <label for="invoice-number">Invoice Number <span>e.g. GS/029466</span></label>
        <input type="text" id="invoice-number" name="invoice_number"
               placeholder="GS/029466" required />
      </div>

      <div>
        <label for="invoice-date">Invoice Date</label>
        <input type="date" id="invoice-date" name="invoice_date"
               value="{{ today }}" required />
      </div>

      <div>
        <label for="carton-cap">Carton Capacity <span>pcs per carton</span></label>
        <input type="number" id="carton-cap" name="carton_capacity"
               value="100" min="1" max="9999" required />
      </div>
    </div>

    <button type="submit" id="submit-btn">
      Generate Invoice &amp; Packing List
      <div class="spinner"></div>
    </button>
  </form>

  <div class="message error"   id="error-msg"></div>
  <div class="message success" id="success-msg"></div>
</div>

<script>
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const fileName   = document.getElementById('file-name');
  const form       = document.getElementById('po-form');
  const submitBtn  = document.getElementById('submit-btn');
  const errorMsg   = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  let selectedFile = null;

  function setFile(file) {
    if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
      showError('Please select a PDF file.');
      return;
    }
    selectedFile = file;
    fileName.textContent = '✓ ' + file.name;
    fileName.style.display = 'block';
    dropZone.classList.add('has-file');
    dropZone.classList.remove('drag-over');
    hideMessages();
  }

  fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    setFile(e.dataTransfer.files[0]);
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    successMsg.style.display = 'none';
  }
  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = 'block';
    errorMsg.style.display = 'none';
  }
  function hideMessages() {
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    if (!selectedFile) { showError('Please select a PDF file.'); return; }

    const invNo = document.getElementById('invoice-number').value.trim();
    if (!invNo) { showError('Please enter an invoice number.'); return; }

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    const data = new FormData();
    data.append('po_pdf', selectedFile);
    data.append('invoice_number', invNo);
    data.append('invoice_date', document.getElementById('invoice-date').value);
    data.append('carton_capacity', document.getElementById('carton-cap').value);

    try {
      const res = await fetch('/generate', { method: 'POST', body: data });

      if (!res.ok) {
        const json = await res.json().catch(() => ({ error: 'Unknown error' }));
        showError(json.error || `Server error (${res.status})`);
        return;
      }

      // Trigger download
      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="?([^"]+)"?/);
      const dlName = match ? match[1] : 'invoice.xlsx';

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = dlName; a.click();
      URL.revokeObjectURL(url);

      showSuccess(`✓ ${dlName} downloaded successfully!`);
    } catch (err) {
      showError('Network error — is the server running?');
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
