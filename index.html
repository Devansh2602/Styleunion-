<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PO Invoice Generator — United Textile Mills</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);padding:36px;width:100%;max-width:500px}
h1{font-size:1.4rem;font-weight:700;color:#1a202c;margin-bottom:4px}
.sub{font-size:.83rem;color:#718096;margin-bottom:26px}
label{display:block;font-size:.82rem;font-weight:600;color:#4a5568;margin-bottom:5px;margin-top:14px}
input{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.9rem;outline:none;transition:border .2s}
input:focus{border-color:#4299e1}
.drop{border:2px dashed #cbd5e0;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.drop:hover,.drop.over{border-color:#4299e1;background:#ebf8ff}
.drop p{font-size:.85rem;color:#718096;margin-top:6px}
.fname{font-size:.8rem;color:#4299e1;font-weight:600;margin-top:4px}
#pdfFile{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{display:block;width:100%;margin-top:22px;padding:12px;background:#2b6cb0;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#2c5282}
button:disabled{background:#a0aec0;cursor:not-allowed}
#status{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:.84rem;display:none;line-height:1.5}
.ok{background:#f0fff4;color:#276749;border:1px solid #c6f6d5}
.err{background:#fff5f5;color:#c53030;border:1px solid #fed7d7}
.info{background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
pre{font-size:.7rem;max-height:200px;overflow:auto;background:#f7fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-top:8px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h1>PO Invoice Generator</h1>
  <p class="sub">United Textile Mills Pvt. Ltd.</p>

  <label>Purchase Order PDF</label>
  <div class="drop" id="dz" onclick="document.getElementById('pdfFile').click()">
    <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="#a0aec0" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
    </svg>
    <p>Click or drag a PDF here</p>
    <div class="fname" id="fname"></div>
  </div>
  <input type="file" id="pdfFile" accept=".pdf">

  <label>Invoice Number</label>
  <input type="text" id="invNo" placeholder="e.g. INV-001">

  <div class="row">
    <div>
      <label>Invoice Date</label>
      <input type="date" id="invDate">
    </div>
    <div>
      <label>Carton Capacity (pcs)</label>
      <input type="number" id="cap" value="100" min="1">
    </div>
  </div>

  <button id="btn" onclick="run()">&#11015; Generate Excel</button>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

});

  const f=e.target.files[0];if(f){window._file=f;document.getElementById('fname').textContent=f.name;}
};

// ── Constants ─────────────────────────────────────────────────────────────
const SIZE_ORDER={XS:0,S:1,M:2,L:3,XL:4,XXL:5,'2XL':5,'3XL':6};
const VALID_SIZES=new Set(['XS','S','M','L','XL','XXL','2XL','3XL']);
// Template has 20 pre-styled INV item rows (23-42), 150 PKG carton rows (17-166)
const N_INV=20, N_PKG=150;
const INV_FIRST=23, PKG_FIRST=17;
const INV_T=INV_FIRST+N_INV;   // row 43: INV totals footer
const PKG_TOT=PKG_FIRST+N_PKG; // row 167: PKG totals footer

// ── Utilities ─────────────────────────────────────────────────────────────
const sortItems=items=>[...items].sort((a,b)=>(SIZE_ORDER[a.size]??99)-(SIZE_ORDER[b.size]??99));

function numWords(n){
  n=Math.round(n);if(!n)return'ZERO';
  const o=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE',
    'TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const t=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  const d2=x=>x<20?o[x]:t[~~(x/10)]+(x%10?' '+o[x%10]:'');
  const d3=x=>x>=100?o[~~(x/100)]+' HUNDRED'+(x%100?' '+d2(x%100):''):d2(x);
  const p=[];
  if(n>=1e7){p.push(d3(~~(n/1e7))+' CRORE');n%=1e7;}
  if(n>=1e5){p.push(d3(~~(n/1e5))+' LAKH');n%=1e5;}
  if(n>=1e3){p.push(d2(~~(n/1e3))+' THOUSAND');n%=1e3;}
  if(n>0)p.push(d3(n));
  return p.join(' ')+' ONLY';
}

function calcCartons(items,cap){
  const cs=[];let no=1;
  for(const item of sortItems(items)){
    const f=Math.floor(item.qty/cap),r=item.qty%cap,as=`${item.barcode} - ${item.size}`;
    for(let i=0;i<f;i++)cs.push({no:no++,article_size:as,description:item.description,color:item.color,qty:cap});
    if(r)cs.push({no:no++,article_size:as,description:item.description,color:item.color,qty:r});
  }
  return cs;
}

// ── PDF text extraction ───────────────────────────────────────────────────
async function extractPDFText(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const its=tc.items.filter(i=>i.str).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    if(!its.length)continue;
    its.sort((a,b)=>{const dy=b.y-a.y;return Math.abs(dy)>3?dy:a.x-b.x;});
    const lines=[];let cur=[its[0]],cy=its[0].y;
    for(let i=1;i<its.length;i++){
      if(Math.abs(its[i].y-cy)<=3){cur.push(its[i]);}
      else{lines.push(cur);cur=[its[i]];cy=its[i].y;}
    }
    lines.push(cur);
    for(const line of lines){
      line.sort((a,b)=>a.x-b.x);
      let s='';
      for(let i=0;i<line.length;i++){
        if(i>0){const gap=line[i].x-(line[i-1].x+line[i-1].w);if(gap>2&&!s.endsWith(' ')&&!line[i].s.startsWith(' '))s+=' ';}
        s+=line[i].s;
      }
      if(s.trim())out+=s.trim()+'\n';
    }
  }
  return out;
}

// ── PO Parser ─────────────────────────────────────────────────────────────
function extractCSD(prefix,line2){
  const t1=prefix.trim().split(/\s+/),t2=line2.trim().split(/\s+/),all=[...t1,...t2];
  let si=all.findIndex(t=>VALID_SIZES.has(t.toUpperCase()));
  if(si<0)return[prefix.trim(),line2.trim(),''];
  const color=all.slice(0,si).join(' '),size=all[si].toUpperCase(),n1=t1.length;
  let desc;
  if(si<n1){
    const after=t1.slice(si+1);
    if(after.length&&after[after.length-1].endsWith('-')){
      const pre=after.join(' ');
      desc=t2.length?pre.trimEnd()+t2[0]+(t2.length>1?' '+t2.slice(1).join(' '):''):pre;
    }else{
      desc=(after.length?after.join(' ')+(t2.length?' ':'')+t2.join(' '):t2.join(' ')).trim();
    }
  }else{
    desc=all.slice(si+1).join(' ');
  }
  return[color.trim(),size,desc.trim()];
}

function parsePO(text){
  const res={};
  let m;
  m=text.match(/Order No\.\s*:\s*([A-Z0-9()/\-]+)/);res.po_number=m?m[1].trim():'';
  m=text.match(/Date\s*:\s*(\d{2}-\d{2}-\d{4})/);res.po_date=m?m[1].replace(/-/g,'.'):'';
  m=text.match(/GSTIN\s*[:\-]+\s*([A-Z0-9]{15})/);res.consignee_gst=m?m[1]:'36AAQCS3643G1Z2';
  m=text.match(/(Nexon Omniverse Limited)/);res.consignee_name=m?m[1]:'Nexon Omniverse Limited';
  m=text.match(/IGST\s*\[?\s*@\s*(\d+)%/);res.igst_rate=m?parseFloat(m[1])/100:0.05;
  const am=text.match(/AWL INDIA PVT LTD[^\n]*\n([^\n]*)\n([^\n]*(?:Malkajgiri|Medchal)[^\n]*)\n([^\n]*500078)/);
  res.consignee_address_lines=am?[
    (text.match(/AWL INDIA PVT LTD[^\n]*/)||[''])[0].trim(),
    (am[1].trim()+' '+am[2].trim()).trim(),am[3].trim(),'Telangana,INDIA'
  ]:['AWL INDIA PVT LTD, SV NO 705/2, 706/4 DEVARYAMJAL, Opp.',
     'Sai Geetha Ashramam, Tumkunta Municipality, Medchal Malkajgiri',
     'Hyderabad, 500078','Telangana,INDIA'];

  const re=/(\d{13})\s+STYLE\s+UNION\s+(\w+)\s+(.+?)\s+(\d{7,8})\s+(\d+\.\d{3})\s*(\d+\.\d{2})\s+([\d,]+\.\d{3})\s+PCS\s+([\d,]+\.\d{2})\s*\n([^\n]+)/gm;
  const items=[];let im;
  while((im=re.exec(text))!==null){
    const[,barcode,style,prefix,hsn,rate,mrp,qty,amount,line2]=im;
    const[color,size,desc]=extractCSD(prefix,line2);
    items.push({barcode:barcode.trim(),style:style.trim(),color,hsn:hsn.trim(),
      rate:+rate,mrp:+mrp,qty:parseInt(parseFloat(qty.replace(/,/g,''))),
      amount:parseFloat(amount.replace(/,/g,'')),size,description:desc});
  }
  res.items=items;
  return res;
}

// ── SheetJS helpers ───────────────────────────────────────────────────────
const A=(r,c)=>XLSX.utils.encode_cell({r:r-1,c:c-1});

function wSet(ws,r,c,v){
  const a=A(r,c),t=typeof v==='number'?'n':'s';
  if(!ws[a])ws[a]={t,v};
  else{ws[a].t=t;ws[a].v=v;}
}

function clearColBorders(ws,col){
  const r=XLSX.utils.decode_range(ws['!ref']);
  for(let i=0;i<=r.e.r;i++){
    const a=XLSX.utils.encode_cell({r:i,c:col-1});
    if(ws[a]?.s)ws[a].s={...ws[a].s,border:{}};
  }
}

// ── Fill INV ──────────────────────────────────────────────────────────────
// Template has N_INV=20 pre-styled item rows at 23-42; footer fixed at row 43
function fillINV(ws,po,invNo,invDate,totalCartons){
  const items=sortItems(po.items),n=items.length;
  const totalQty=items.reduce((s,i)=>s+i.qty,0);
  const totalAmt=items.reduce((s,i)=>s+i.amount,0);
  const igst=po.igst_rate||0.05,igstAmt=Math.round(totalAmt*igst),grand=totalAmt+igstAmt;
  const con=po.consignee_name,adr=po.consignee_address_lines,gst=po.consignee_gst;

  wSet(ws,2,7,`Invoice No : ${invNo}`);
  wSet(ws,3,7,`Date of Issue of Invoice :  ${invDate}`);
  wSet(ws,9,7,`Purchase Order No : ${po.po_number}`);
  wSet(ws,10,8,po.po_date||'');
  wSet(ws,12,7,`  No. of Cartons : ${totalCartons}`);

  wSet(ws,15,1,con+'\n');wSet(ws,15,7,con+'\n');
  ['A15','G15'].forEach(a=>{if(ws[a]?.s)ws[a].s={...ws[a].s,alignment:{horizontal:'left',vertical:'top',wrapText:true}};});
  adr.slice(0,4).forEach((l,i)=>{wSet(ws,16+i,1,l);wSet(ws,16+i,7,l);});
  wSet(ws,20,1,`GST NO :- ${gst}`);wSet(ws,20,7,`GST NO :- ${gst}`);

  clearColBorders(ws,15);

  // Fill item rows (pre-styled in template, just set values)
  for(let idx=0;idx<n;idx++){
    const row=INV_FIRST+idx,item=items[idx];
    wSet(ws,row,1,idx+1);wSet(ws,row,2,item.barcode);
    wSet(ws,row,4,item.color);wSet(ws,row,5,item.size);
    wSet(ws,row,6,item.description);wSet(ws,row,7,item.style);
    wSet(ws,row,8,parseInt(item.hsn)||item.hsn);
    wSet(ws,row,9,'EA');wSet(ws,row,10,item.mrp);wSet(ws,row,11,item.rate);
    wSet(ws,row,12,item.qty);wSet(ws,row,13,item.qty);wSet(ws,row,14,item.amount);
  }

  // Footer at fixed position INV_T=43
  const T=INV_T;
  wSet(ws,T,12,totalQty);wSet(ws,T,13,totalQty);wSet(ws,T,14,totalAmt);
  wSet(ws,T+1,14,0);wSet(ws,T+2,14,totalAmt);wSet(ws,T+3,14,0);wSet(ws,T+4,14,0);
  wSet(ws,T+6,12,igst);wSet(ws,T+6,14,igstAmt);
  wSet(ws,T+9,14,0);wSet(ws,T+10,14,grand);
  wSet(ws,T+11,1,`Amount Chargeable ( in Words ) : ${numWords(grand)}.`);
  wSet(ws,T+12,1,`IGST Amount ( in words) : ${numWords(igstAmt)}.`);
}

// ── Fill PKG ──────────────────────────────────────────────────────────────
// Template has N_PKG=150 pre-styled carton rows at 17-166; total fixed at row 167
function fillPKG(ws,po,invNo,invDate,cartons,totalCartons){
  const tp=cartons.reduce((s,c)=>s+c.qty,0);
  const con=po.consignee_name,adr=po.consignee_address_lines,gst=po.consignee_gst;

  wSet(ws,3,5,`Tax invoice No: ${invNo}`);wSet(ws,4,5,`Date of issue of Invoice :${invDate}`);
  wSet(ws,5,5,`P.O.NO.: ${po.po_number}`);wSet(ws,7,5,`Total No of Cartons:- ${totalCartons}`);
  wSet(ws,8,5,`Total No of pcs. ${tp}`);
  wSet(ws,10,1,con);
  adr.slice(0,4).forEach((l,i)=>wSet(ws,11+i,1,l));
  wSet(ws,15,1,`GSTIN :${gst}`);

  // Fill carton rows (pre-styled in template, just set values)
  cartons.forEach((c,i)=>{
    const row=PKG_FIRST+i;
    wSet(ws,row,1,'');wSet(ws,row,2,c.no);wSet(ws,row,3,'OF');
    wSet(ws,row,4,totalCartons);wSet(ws,row,5,c.article_size);
    wSet(ws,row,6,c.description);wSet(ws,row,7,c.color);
    wSet(ws,row,8,c.qty);wSet(ws,row,9,1);wSet(ws,row,10,c.qty);
  });

  // Total at fixed position PKG_TOT=167
  wSet(ws,PKG_TOT,8,tp);wSet(ws,PKG_TOT,10,tp);
}

// ── Generate ──────────────────────────────────────────────────────────────
function generateExcel(po,invNo,cap,invDate){
  const wb=XLSX.read(TEMPLATE_B64,{type:'base64',cellStyles:true});
  const cartons=calcCartons(po.items,cap);
  fillINV(wb.Sheets['INV'],po,invNo,invDate,cartons.length);
  fillPKG(wb.Sheets['PKG'],po,invNo,invDate,cartons,cartons.length);
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true});
  return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ── Status helpers ────────────────────────────────────────────────────────
function setStatus(msg,cls,extra=''){
  const el=document.getElementById('status');
  el.innerHTML=msg+(extra?`<pre>${extra}</pre>`:'');
  el.className=cls;el.style.display='block';
}

// ── Run ───────────────────────────────────────────────────────────────────
async function run(){
  const file=window._file||document.getElementById('pdfFile').files[0];
  if(!file)return setStatus('Please select a PDF file.','err');
  const invNo=document.getElementById('invNo').value.trim();
  if(!invNo)return setStatus('Please enter an invoice number.','err');
  const rawDate=document.getElementById('invDate').value;
  const invDate=rawDate?rawDate.split('-').reverse().join('.'):'';
  const cap=parseInt(document.getElementById('cap').value)||100;

  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Processing…';
  setStatus('Reading PDF…','info');

  try{
    const buf=await file.arrayBuffer();
    setStatus('Extracting text…','info');
    const text=await extractPDFText(buf);
    setStatus('Parsing PO…','info');
    const po=parsePO(text);

    if(!po.items||!po.items.length){
      const snippet=text.split('\n').filter(l=>l.trim()).slice(0,40).join('\n');
      throw new Error('No items found. The PDF text below was extracted — share it to get help:\n\n'+snippet);
    }
    if(po.items.length>N_INV)throw new Error(`Too many item lines (${po.items.length}). Max supported: ${N_INV}.`);
    const cartons=calcCartons(po.items,cap);
    if(cartons.length>N_PKG)throw new Error(`Too many cartons (${cartons.length}). Increase carton capacity or contact support.`);

    setStatus(`Found ${po.items.length} items, ${cartons.length} cartons — generating Excel…`,'info');
    const blob=generateExcel(po,invNo,cap,invDate);
    const fname=`${invNo}-${po.po_number||'invoice'}.xlsx`;
    const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:fname});
    a.click();URL.revokeObjectURL(a.href);
    setStatus(`&#10003; Downloaded: ${fname}`,'ok');
  }catch(e){
    setStatus('Error: '+e.message.split('\n')[0],'err',
      e.message.includes('\n')?e.message.slice(e.message.indexOf('\n')+1):'');
    console.error(e);
  }
  btn.disabled=false;btn.textContent='&#11015; Generate Excel';
}
